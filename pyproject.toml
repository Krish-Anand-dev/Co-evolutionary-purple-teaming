# Tool configuration only (the project is not a pip package). Conventions: ruff + black, line length 120.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["external", "venv", "venv-blue", "results"]

[tool.ruff.lint]
# Correctness gate: pyflakes (unused or undefined names, ...) + the serious pycodestyle errors. Style rules are left to black.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These files put external/cage-challenge-4 on sys.path or call pytest.importorskip BEFORE importing, on purpose.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "/(external|venv|venv-blue|results)/"
